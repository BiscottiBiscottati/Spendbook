<div class="spendbook-drawer inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <div class="flex-container alignitemscenter margin0">
            <b>Spendbook</b>
        </div>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <label class="checkbox_label" for="spendbook_tracking_enabled">
            <input id="spendbook_tracking_enabled" type="checkbox">
            <span>Track token usage</span>
        </label>
        <small class="spendbook-privacy-note">
            Spendbook records token counts, cost and latency for chat-completion
            requests made by this browser. It never stores prompt text, and an
            export carries no chat identifiers unless you ask for them.
        </small>
    </div>
</div>
